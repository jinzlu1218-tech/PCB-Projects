[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipvision"
version = "0.1.0"
description = "Chip pose estimation and chip-surface OCR for PCB images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Machine Vision Course Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
  "torch>=2.4",
  "torchvision>=0.19",
  "easyocr>=1.7.1",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
chipvision = "chipvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
